services:
  # 1. Cơ sở dữ liệu PostgreSQL
  newsradar-postgres:
    image: postgres:16-alpine
    container_name: newsradar-postgres
    restart: always
    environment:
      POSTGRES_DB: news_radar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_radar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache cho Hot News & Rate Limiting
  newsradar-redis:
    image: redis:7-alpine
    container_name: newsradar-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend .NET 10 Web API
  newsradar-api:
    build:
      context: ./server
      dockerfile: src/NewsRadar.Api/Dockerfile
    container_name: newsradar-api
    restart: always
    ports:
      - "5275:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=newsradar-postgres;Port=5432;Database=news_radar_db;Username=postgres;Password=${DB_PASSWORD:-123456}
      - ConnectionStrings__Redis=newsradar-redis:6379
      - Jwt__Secret=${JWT_SECRET:-NewsRadar_SuperSecretKey_ChangeInProduction_Min32Chars!}
      - Jwt__Issuer=NewsRadar
      - Jwt__Audience=NewsRadarClient
      - AllowedOrigins=http://localhost,http://localhost:80,http://localhost:5173
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      newsradar-postgres:
        condition: service_healthy
      newsradar-redis:
        condition: service_healthy

  # 4. Frontend React Client (Nginx Reverse Proxy)
  newsradar-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: newsradar-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - newsradar-api

volumes:
  postgres_data:

