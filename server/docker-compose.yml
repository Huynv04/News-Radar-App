services:
  # 1. Container Database PostgreSQL
  newsradar-postgres:
    image: postgres:16-alpine
    container_name: newsradar-postgres
    restart: always
    environment:
      POSTGRES_DB: news_radar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# 1.1 Bổ sung Container Redis Cache
  newsradar-redis:
    image: redis:7-alpine
    container_name: newsradar-redis
    restart: always
    ports:
      - "6379:6379"
      
  # 2. Container Backend .NET 10 API
  newsradar-api:
    build:
      context: .
      dockerfile: src/NewsRadar.Api/Dockerfile
    container_name: newsradar-api
    restart: always
    ports:
      - "5275:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=newsradar-postgres;Port=5432;Database=news_radar_db;Username=postgres;Password=123456
      - ConnectionStrings__Redis=newsradar-redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - newsradar-postgres
      - newsradar-redis

volumes:
  postgres_data: